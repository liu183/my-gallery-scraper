name: scrape-everiaclub

on:
  # schedule disabled: Cloudflare Turnstile blocks GitHub Actions IPs.
  # Re-enable once a residential proxy / FlareSolverr is provisioned.
  # schedule:
  #   - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: scrape-everiaclub
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        id: run
        run: python -m scrapers.everiaclub

      - name: Read artifact meta
        if: steps.run.outputs.status == 'ok'
        id: meta
        shell: bash
        run: |
          NAME=$(python -c "import json;print(json.load(open('output/artifact-meta.json'))['artifact_name'])")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-everiaclub-${{ github.run_id }}
          path: output/debug-*
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload artifact
        if: steps.run.outputs.status == 'ok'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: output
          retention-days: 90
          if-no-files-found: error

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/everiaclub.json || true
          if git diff --cached --quiet; then
            echo "no state changes"; exit 0
          fi
          git commit -m "chore(state): everiaclub $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after retries"; exit 1
